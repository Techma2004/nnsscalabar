# NNSS Calabar portal: nginx TLS reverse proxy (Linux). See HTTPS.md.
# Node keeps listening on 127.0.0.1:5000 only; nginx is the only thing the LAN or
# internet can reach. Replace portal.school.lan with your real host name, and the
# certificate paths with yours (LAN CA: HTTPS.md section 2; Let's Encrypt: section 3).

server {
    listen 80;
    listen [::]:80;
    server_name portal.school.lan;
    # Let's Encrypt HTTP-01 challenges (harmless on a LAN-only server)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.school.lan;

    ssl_certificate     /etc/nginx/tls/portal.school.lan.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/portal.school.lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # Do NOT add Strict-Transport-Security here: the app already sends it when
    # NODE_ENV=production, and sending it twice is wrong.

    # Largest request the app accepts is the 11 MB OCR image sent as base64 JSON.
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # The app compares the Origin header with Host for state-changing requests,
        # so Host must reach it unchanged.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, never append: only this proxy may tell the app the client address.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # the optional OCR scan can take up to a minute
    }
}
