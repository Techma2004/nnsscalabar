# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature. For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '36 10 * * 4'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Give each run a stable, unique category. GitHub limits each SARIF
      # upload to 20 runs, so split the report into chunks without dropping
      # any runs or results.
      - name: Prepare SARIF upload batches
        run: |
          jq '(.runs) |= (to_entries | map(. as $entry | $entry.value | .automationDetails = ((.automationDetails // {}) + {id: ("codacy-" + ($entry.key | tostring))})))' results.sarif > results.categorized.sarif
          jq '.runs = .runs[0:20]' results.categorized.sarif > results-part1.sarif
          jq '.runs = .runs[20:40]' results.categorized.sarif > results-part2.sarif
          if [ "$(jq '.runs | length' results-part2.sarif)" -eq 0 ]; then
            rm results-part2.sarif
          fi

      - name: Upload SARIF results (runs 1–20)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-part1.sarif
          category: codacy-batch-1

      - name: Upload SARIF results (runs 21–40)
        if: ${{ hashFiles('results-part2.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-part2.sarif
          category: codacy-batch-2
