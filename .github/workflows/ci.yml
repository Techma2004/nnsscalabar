name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-checks:
    name: Node.js syntax and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend JavaScript syntax
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './node_modules' -prune -o -type f -name '*.js' -print0)
      - name: Run smoke tests
        working-directory: backend
        run: npm test
      - name: Check production dependency vulnerabilities
        working-directory: backend
        run: npm audit --omit=dev --audit-level=low

  python-checks:
    name: Python OCR dependency and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Validate lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile Python source
        run: uv run python -m compileall -q .
      - name: Check Python dependency vulnerabilities
        run: uv run --with pip-audit pip-audit
